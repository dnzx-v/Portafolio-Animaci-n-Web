<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .cajita{
        width: 100px;
        height: 100px;
        background-color: rgb(157, 204, 239);
        animation: girar 1s infinite, cambioColores 3s infinite;
    }
    @keyframes girar{
        from{
            transform: rotate(0deg);
        }
        to{
            transform: rotate(360deg);
        }
    }
    @keyframes cambioColores{
        0% {background-color: rgb(216, 207, 254);}
        25% {background-color: rgb(242, 215, 255);}
        50% {background-color: rgb(196, 255, 248);}
        75% {background-color: azure;}
        100% {background-color: lightcoral;}
    }
</style>
<body>
    <div class="cajita"></div>
</body>
</html>
